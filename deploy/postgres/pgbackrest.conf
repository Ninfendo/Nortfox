# SPDX-License-Identifier: AGPL-3.0-only
#
# pgBackRest for a NortFox install (docs/decisions/0007-self-hosting-and-backups.md).
# PostgreSQL archives every WAL segment to both repositories
# (archive_command in deploy/compose.yaml), and a full backup goes to each
# repository on its own (deploy/README.md).
#
# repo1, the local repository, is the backups volume of deploy/compose.yaml.
# repo2, the off-site repository, gets its type and path from the compose
# file's required variables NORTFOX_REPO2_TYPE and NORTFOX_REPO2_PATH, and its
# other options, such as a bucket and its keys, from the repo2-options secret,
# which the compose file mounts at /etc/pgbackrest/conf.d/repo2.conf. So this
# file never sets repo2-type or repo2-path, and the stack does not start
# without them.
#
# Both repositories keep every full backup: removing an old backup is the
# operator's step, never pgBackRest's. 9999999 is the highest count that
# pgBackRest takes.
#
# scripts/guards/deploy.ts pins these settings.

[global]
repo1-path=/var/lib/pgbackrest
repo1-retention-full=9999999
repo2-retention-full=9999999
start-fast=y
log-level-console=info
log-level-file=off

[nortfox]
pg1-path=/var/lib/postgresql/18/docker
