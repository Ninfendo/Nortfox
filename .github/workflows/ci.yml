# SPDX-License-Identifier: AGPL-3.0-only
#
# Every CI job, and "CI OK", the required check that passes only when all of
# them passed. No pull_request job needs a secret, so a PR from a fork runs
# every job. There is no paths filter: every PR runs everything.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

# A newer run of a PR cancels the older one. Each run for a push to main has
# a group of its own, so no newer run ever cancels it. In a shared group,
# GitHub drops a waiting run when a newer one joins, and "names (main)" would
# then never check that push's commits.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Test with coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: openapi.json and the client are up to date
        run: |
          pnpm openapi
          git diff --exit-code -- packages/client/openapi.json packages/client/src/generated.ts

  workflows:
    name: workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  ci-ok:
    name: CI OK
    needs: [build, workflows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Every needed job succeeded
        run: node scripts/ci/ci-ok.ts
        env:
          NEEDS: ${{ toJSON(needs) }}

  names-main:
    name: names (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so that every commit the push added is here.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: No protected name in main
        run: node scripts/names/cli.ts --all --base HEAD
        env:
          PROTECTED_NAMES: ${{ secrets.PROTECTED_NAMES }}
      # The step above reads only the last commit. A push can add more than
      # one, and a merge made by hand, or a squash message edited in the merge
      # box, is text that the PR's Names check never saw. This step runs even
      # when the one above fails, because the next push checks only its own
      # commits.
      - name: No protected name in a commit the push added
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          id='^([0-9a-f]{40}|[0-9a-f]{64})$'
          if [[ ! "$AFTER" =~ $id ]]; then
            echo "names: the pushed commit is not a commit id." >&2
            exit 1
          fi
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            # The push made the branch, so there is no commit before it.
            git rev-list --max-count=1 "$AFTER" -- > "$RUNNER_TEMP/commits"
          elif [[ "$BEFORE" =~ $id ]] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
            git rev-list "$BEFORE..$AFTER" -- > "$RUNNER_TEMP/commits"
          else
            echo "names: the commit before the push is not in the clone, so the check cannot tell which commits the push added." >&2
            exit 1
          fi
          count=0
          failed=0
          # The three texts that the names check reads from a commit, each
          # without the line breaks at its end, as the names check reads them.
          check() {
            local text
            text=$(git log -1 --format="$2" "$commit" --)
            printf '%s' "$text" | node scripts/names/cli.ts --text --label "$1" || failed=1
          }
          while IFS= read -r commit <&3; do
            check "commit ${commit:0:7}" "%B"
            check "commit ${commit:0:7} author" "%an <%ae>"
            check "commit ${commit:0:7} committer" "%cn <%ce>"
            count=$((count + 1))
          done 3< "$RUNNER_TEMP/commits"
          echo "names: checked ${count} commits that the push added."
          exit "$failed"
        env:
          PROTECTED_NAMES: ${{ secrets.PROTECTED_NAMES }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
