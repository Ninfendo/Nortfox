#
# The approval checks: "Outside approval", "Owner OK" and "Names"
# (docs/plan.md, section 6).
#
# On pull_request_target, GitHub runs this file as it is on the base branch,
# never the PR's copy, with a token for this repository. So no job here ever
# checks out, installs or runs the PR's code. Each job checks out the base
# branch to get the checks, and reads the PR's files, paths, commits, title and
# body through the API, as data.
#
# A review re-runs the checks, so that an approval counts at once. GitHub runs
# pull_request_review with the PR's own copy of this file, as it does
# pull_request: from a fork it gets a read-only token and no secrets. Until the
# owner pins these checks to the approval App (docs/plan.md, step 1), a PR could
# change that copy; .github/** is an owner path, so the review reads every such
# change. On a review, Names repeats the verdict of the last full check instead
# of checking again, because a review changes no text.

name: Approvals

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Only the base branch is checked out; the PR is read through the API as data.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

# No concurrency group: every event must run to its end. A push that is
# cancelled by a later event would never remove the owner-ok label.

env:
  OWNER_LOGIN: Ninfendo

jobs:
  names:
    name: Names
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the base branch; read the PR's files at its head
      pull-requests: read # list the PR's files and commits
      checks: read # on a review: find the last full Names check
      actions: read # on a review: tell which run made it
    steps:
      - name: Check out the base branch, never the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the PR's files, paths, title, body, branch and commits
        if: github.event_name == 'pull_request_target'
        run: node scripts/names/cli.ts --pr
        env:
          PROTECTED_NAMES: ${{ secrets.PROTECTED_NAMES }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - name: Repeat the last full check, because a review changes no text
        if: github.event_name == 'pull_request_review'
        run: node scripts/approvals/cli.ts names-mirror
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  outside-approval:
    name: Outside approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the base branch
      pull-requests: read # read the PR and its reviews
    steps:
      - name: Check out the base branch, never the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The owner wrote the PR, or approved its head commit
        run: node scripts/approvals/cli.ts outside-approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  owner-ok:
    name: Owner OK
    needs: names
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the base branch; compare the pushed commits
      pull-requests: write # only to remove the owner-ok label after a push that touches an owner path
    steps:
      - name: Check out the base branch, never the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Names passed, and owner paths carry the owner-ok label
        run: node scripts/approvals/cli.ts owner-ok
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_ACTION: ${{ github.event.action }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          NAMES_RESULT: ${{ needs.names.result }}
