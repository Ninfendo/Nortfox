#
# The approval checks: "Outside approval", "Owner OK" and "Names"
# (docs/plan.md, section 6).
#
# The workflow runs on pull_request_target only. GitHub then runs this file as
# it is on the default branch, never the PR's copy, in the default branch's
# context, with a token for this repository. So no job here ever checks out,
# installs or runs the PR's code. Each job checks out the default branch to get
# the checks. Names fetches the PR's head commit by its SHA and reads it with
# git as data; the other checks read the PR through the API. Only a PR into the
# default branch starts it, and each check fails a PR aimed anywhere else: a
# check runs on a head commit, so a pass for a PR into another branch would
# count for every PR with that head commit.
#
# "edited" is on the list because the title, the body and the base can change
# after the last run, and the squash merge copies the title and body into the
# default branch.
#
# A review starts no run. After approving a PR from an outside contributor,
# the owner re-runs the failed jobs of its latest run; after asking for
# changes or dismissing a review, all of that run's jobs. Only then do the
# checks see the review. Names reads such a PR with the list only in a run that
# the owner's account started (github.triggering_actor), never in a run that
# the author's own push or edit started.
#
# Dependabot's PRs come from another account too, but a re-run does not work
# there. A re-run keeps the rights of the account that started the first run
# (github.actor), and GitHub gives a run that Dependabot started no secrets.
# So Names has no list and fails, and says why. On such a PR an agent starts
# a new run from the owner's account instead, after the owner's review agent
# has approved its head commit: it adds a label, any but owner-ok, and removes
# it again.
#
# Each check judges the head commit that the event names (HEAD_SHA), and fails
# when the PR's head is another commit, so a verdict lands only on the commit
# it judged.
#
# Any PR can still add a job of its own, in another workflow, that reports
# with the name of a required check. The owner may pin "CI OK", "Outside
# approval", "Owner OK" and "Names" to GitHub Actions, but that does not stop
# such a job, because it runs on GitHub Actions too. The gate against a faked
# check is the merge rule: a PR from an outside contributor is merged only by
# the owner, by hand, after reading the whole diff, and agents never merge one.
# A PR that Dependabot opened from a branch in this repository is merged by an
# agent, only after the owner's review agent has read its whole diff.

name: Approvals

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Only the default branch is checked out; the PR is read as data.
    types: [opened, synchronize, reopened, edited, ready_for_review, labeled, unlabeled]
    branches: [main]

permissions: {}

# One run per PR at a time, so no two runs for one PR overlap, and the newest
# event's verdict is written last. A newer event waits until the run before it
# ends, and GitHub keeps only the newest of the waiting runs. Every check
# decides from the PR as it is when it runs, so a run that waits or is dropped
# loses nothing.
concurrency:
  group: approvals-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  OWNER_LOGIN: Ninfendo

jobs:
  names:
    name: Names
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # check out the default branch with its history, and fetch the PR's head commit
      pull-requests: read # read the PR and its reviews
    steps:
      - name: Check out the default branch, never the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0 # the whole history, to find where the PR branched off
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the PR's files, paths, title, body, branch and commits
        run: node scripts/names/cli.ts --pr
        env:
          PROTECTED_NAMES: ${{ secrets.PROTECTED_NAMES }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          RUN_ACTOR: ${{ github.actor }} # whose rights the run has, which a re-run keeps

  outside-approval:
    name: Outside approval
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch
      pull-requests: read # read the PR and its reviews
    steps:
      - name: Check out the default branch, never the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: The owner wrote the PR, or approved its head commit
        run: node scripts/approvals/cli.ts outside-approval
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  owner-ok:
    name: Owner OK
    needs: names
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read # check out the default branch; read the PR branch's push history
      issues: read # read when the owner-ok label was set
      pull-requests: write # only to remove an owner-ok label that does not count for the head commit
    steps:
      - name: Check out the default branch, never the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Names passed, and owner paths carry the owner-ok label set on the head commit
        run: node scripts/approvals/cli.ts owner-ok
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NAMES_RESULT: ${{ needs.names.result }}
