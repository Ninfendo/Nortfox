#
# Weekly updates, one grouped PR per ecosystem. The cooldown matches the
# minimum release age in pnpm-workspace.yaml: a version is three days old
# before it is proposed.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
