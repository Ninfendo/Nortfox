# SPDX-License-Identifier: AGPL-3.0-only
#
# Weekly updates, one grouped PR per ecosystem. A version is proposed once it
# is a week old, well past the three-day minimum release age that
# pnpm-workspace.yaml sets for every install.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # @types/node keeps the major of Node, the one runtime. With the types of
    # a later major, code that calls an API that Node 24 lacks passes the type
    # check and fails on the server. The types move to a new major by hand, in
    # the PR that moves Node (scripts/guards/node-types.ts).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
